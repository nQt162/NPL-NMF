[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topicsum-backend"
version = "0.1.0"
requires-python = ">=3.10"
description = "Vietnamese extractive summarization with shared NMF"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "dill>=0.3.8",
  "underthesea>=6",
  "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["stopwords_vi.txt", "nmf_corpus.joblib"]
